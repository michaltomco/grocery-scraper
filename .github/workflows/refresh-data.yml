name: Refresh grocery data

on:
  schedule:
    # Retry hourly at an off-peak minute. Delayed jobs catch up after 06:00
    # Europe/Prague; fresh snapshots prevent duplicate daily downloads.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: grocery-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only trusted main-branch schedule/manual jobs run on this dedicated host.
    runs-on: [self-hosted, linux, x64, grocery-scraper]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
          ref: main

      - name: Update from main
        run: git pull --rebase origin main

      - id: time
        name: Check Prague scrape time
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 refresh_schedule.py --event "$GITHUB_EVENT_NAME" --now "$(TZ=Europe/Prague date --iso-8601=seconds)" | tee -a "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        if: steps.time.outputs.run == 'true'

      - name: Install locked dependencies
        if: steps.time.outputs.run == 'true'
        run: uv sync --locked

      - name: Refresh retailers independently
        id: scrape
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: uv run python run.py

      - name: Build dashboard
        id: build
        if: steps.scrape.outputs.merged == 'true'
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: uv run python build_site.py

      - name: Preserve refresh status artifact
        if: always() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: refresh-status
          path: refresh_status.json
          if-no-files-found: warn

      - name: Commit refreshed data
        id: commit
        if: always() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure')
        env:
          MERGED: ${{ steps.scrape.outputs.merged }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          # A status-only commit deploys the previously committed safe snapshots.
          # Never stage partially written merge output or a failed site build.
          test -f refresh_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refresh_status.json
          if [ "$MERGED" = true ] && [ "$BUILD_OUTCOME" = success ]; then
            git add albert.csv billa.csv lidl.csv tesco.csv all_discounts.csv history.csv nutrition_cache.json site/img
          fi
          if git diff --cached --quiet; then
            echo "No refreshed data changes to commit."
          else
            git commit -m "chore: daily scrape $(TZ=Europe/Prague date +%F) [github-actions]"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger website deployment
        if: always() && steps.commit.outcome == 'success' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" -f ref=main

      - name: Report refresh failures
        if: always() && steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Refresh failed for one or more retailers, or merging failed. See scraper logs; failed retailer snapshots were preserved."
          exit 1
